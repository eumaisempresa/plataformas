<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Controle de Projetos e AILs · EU⁺ Executivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #060E18;
      --bg-secondary: #0A1624;
      --bg-tertiary: #0E1E30;
      --gold: #C4974A;
      --gold-light: #D4AA62;
      --text-primary: #EEF0F2;
      --text-secondary: #7A8FA3;
      --border: rgba(196,151,74,0.18);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #C44A4A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    h1, h2, h3, .title-font {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.6rem;
      color: var(--text-primary);
    }

    header h1 span { color: var(--gold); }

    header .subtitle {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .btn {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 4px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--gold);
      color: var(--bg-primary);
    }

    .btn-secondary {
      border-color: var(--text-secondary);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: var(--text-secondary);
      color: var(--bg-primary);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 11px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem;
    }

    /* Login */
    #login-screen {
      max-width: 420px;
      margin: 10rem auto;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 2.75rem;
      border-radius: 8px;
      text-align: center;
    }

    #login-screen h2 {
      font-size: 1.8rem;
      margin-bottom: 0.4rem;
    }

    #login-screen p {
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--gold);
    }

    /* KPIs */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .kpi {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 0.9rem;
      text-align: center;
    }

    .kpi .number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--gold);
    }

    .kpi .label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      align-items: center;
    }

    .filters input, .filters select {
      width: auto;
      min-width: 140px;
      margin: 0;
      background: var(--bg-secondary);
    }

    /* Accordion */
    .accordion {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .acc-group {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .acc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.1rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }

    .acc-header:hover { background: var(--bg-tertiary); }

    .acc-header h3 {
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .acc-header .count {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .acc-header .chevron {
      color: var(--gold);
      transition: transform 0.25s;
      font-size: 0.9rem;
    }

    .acc-group.open .chevron { transform: rotate(180deg); }

    .acc-body {
      display: none;
      border-top: 1px solid var(--border);
    }

    .acc-group.open .acc-body { display: block; }

    .item-row {
      display: grid;
      grid-template-columns: 1.8fr 0.9fr 0.8fr 0.6fr 1.4fr 1.6fr 1fr 0.7fr;
      gap: 0.6rem;
      padding: 0.75rem 1.1rem;
      border-bottom: 1px solid rgba(196,151,74,0.08);
      font-size: 0.85rem;
      align-items: start;
    }

    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: rgba(196,151,74,0.04); }

    .item-row .nome {
      font-weight: 500;
      color: var(--text-primary);
    }

    .item-row .obs {
      color: var(--text-secondary);
      font-size: 0.8rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .badge-ativo { background: rgba(16,185,129,0.15); color: #34d399; }
    .badge-desacelerando { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .badge-pausado { background: rgba(196,74,74,0.15); color: #f87171; }
    .badge-concluido { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .badge-arquivado { background: rgba(122,143,163,0.15); color: #94a3b8; }

    .link-btn {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.78rem;
      border-bottom: 1px solid transparent;
    }
    .link-btn:hover { border-bottom-color: var(--gold); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6,14,24,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      width: 95%;
      max-width: 520px;
      border-radius: 8px;
      padding: 1.75rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h3 {
      font-size: 1.4rem;
      margin-bottom: 1.25rem;
      color: var(--gold-light);
    }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.7rem;
      margin-top: 1.5rem;
    }

    .loading, .empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    .error-msg {
      background: rgba(196,74,74,0.12);
      color: #f87171;
      padding: 0.7rem 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .top-actions {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-secondary);
      font-size: 0.75rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    footer .slogan {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }

    @media (max-width: 900px) {
      .item-row {
        grid-template-columns: 1fr;
        gap: 0.3rem;
      }
      .item-row > div::before {
        content: attr(data-label);
        font-size: 0.7rem;
        color: var(--text-secondary);
        display: block;
        margin-bottom: 1px;
      }
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <h2>EU<span style="color:var(--gold)">⁺</span> Executivo</h2>
    <p>Controle de Projetos e AILs</p>
    <div id="login-error" class="error-msg" style="display:none;"></div>
    <input type="password" id="password" placeholder="Senha de acesso" autofocus />
    <button class="btn" style="width:100%;" onclick="login()">Entrar</button>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">
    <header>
      <div>
        <h1>EU<span>⁺</span> Executivo</h1>
        <div class="subtitle">Controle de Projetos e AILs · Central do Conhecimento</div>
      </div>
      <div style="display:flex;gap:0.6rem;">
        <button class="btn btn-sm" onclick="openAgentModal()">+ Agente</button>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Sair</button>
      </div>
    </header>

    <div class="container">
      <!-- KPIs -->
      <div class="kpis" id="kpis"></div>

      <!-- Filters + Actions -->
      <div class="filters">
        <input type="text" id="search" placeholder="Buscar por nome..." oninput="renderAccordion()" />
        <select id="filter-status" onchange="renderAccordion()">
          <option value="">Todos Status</option>
          <option>Ativo</option>
          <option>Desacelerando</option>
          <option>Pausado</option>
          <option>Concluído</option>
          <option>Arquivado</option>
        </select>
        <select id="filter-tipo" onchange="renderAccordion()">
          <option value="">Projetos + Produtos</option>
          <option>Projeto</option>
          <option>Produto (AIL)</option>
        </select>
        <button class="btn btn-sm" onclick="loadData()">Atualizar</button>
      </div>

      <!-- Accordion -->
      <div id="loading" class="loading">Carregando...</div>
      <div class="accordion" id="accordion" style="display:none;"></div>
    </div>

    <footer>
      <div class="slogan">“Você é o EU. Nós somos o + que soma com você.”</div>
      <div>Ecossistema EU⁺ › EU⁺ Empresa › EU⁺ Executivo › Controle de Projetos e AILs</div>
    </footer>
  </div>

  <!-- MODAL EDIT PROJECT -->
  <div class="modal-overlay" id="modal-edit">
    <div class="modal">
      <h3 id="modal-title">Editar</h3>
      <div id="modal-error" class="error-msg" style="display:none;"></div>

      <div class="form-group">
        <label>Status</label>
        <select id="edit-status">
          <option>Ativo</option>
          <option>Desacelerando</option>
          <option>Pausado</option>
          <option>Concluído</option>
          <option>Arquivado</option>
        </select>
      </div>
      <div class="form-group">
        <label>Prioridade</label>
        <select id="edit-prioridade">
          <option>Alta</option>
          <option>Média</option>
          <option>Baixa</option>
        </select>
      </div>
      <div class="form-group">
        <label>Próxima Ação</label>
        <input type="text" id="edit-proxima" />
      </div>
      <div class="form-group">
        <label>Observações / Histórico</label>
        <textarea id="edit-obs" rows="4"></textarea>
      </div>
      <div class="form-group">
        <label>Agente</label>
        <input type="text" id="edit-agente" list="lista-agentes" />
        <datalist id="lista-agentes"></datalist>
      </div>
      <div class="form-group">
        <label>LLM</label>
        <input type="text" id="edit-llm" />
      </div>
      <div class="form-group">
        <label>Conta Email LLM</label>
        <input type="text" id="edit-email" />
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('modal-edit')">Cancelar</button>
        <button class="btn" onclick="saveEdit()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL NEW AGENT -->
  <div class="modal-overlay" id="modal-agent">
    <div class="modal">
      <h3>Novo Agente</h3>
      <div id="agent-error" class="error-msg" style="display:none;"></div>

      <div class="form-group">
        <label>Nome do Agente *</label>
        <input type="text" id="agent-nome" placeholder="Ex: Assistente de Ideação" />
      </div>
      <div class="form-group">
        <label>Função / Papel *</label>
        <input type="text" id="agent-funcao" placeholder="O que ele faz" />
      </div>
      <div class="form-group">
        <label>LLM *</label>
        <input type="text" id="agent-llm" placeholder="Grok 4, Llama 3.3..." />
      </div>
      <div class="form-group">
        <label>Conta Email LLM *</label>
        <input type="text" id="agent-email" />
      </div>
      <div class="form-group">
        <label>ID / Nome do Prompt</label>
        <input type="text" id="agent-prompt" />
      </div>
      <div class="form-group">
        <label>Observações</label>
        <textarea id="agent-obs" rows="3"></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal('modal-agent')">Cancelar</button>
        <button class="btn" onclick="saveAgent()">Cadastrar Agente</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbw4uSf-JLJ2nPV5i9gIwa0aAoCGNwJbSjS6NBbirSq8_eaPl8zqxUO9aaAszg1Vki-4/exec';
    
    let password = localStorage.getItem('eu_plus_password') || '';
    let allData = [];
    let currentRow = null;
    let agents = []; // futuro: carregar da planilha de agentes

    // ===== LOGIN =====
    function login() {
      const pass = document.getElementById('password').value.trim();
      if (!pass) return;
      password = pass;
      localStorage.setItem('eu_plus_password', password);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadData();
    }

    function logout() {
      localStorage.removeItem('eu_plus_password');
      password = '';
      document.getElementById('app').style.display = 'none';
      document.getElementById('login-screen').style.display = 'block';
      document.getElementById('password').value = '';
    }

    if (password) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadData();
    }

    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') login();
    });

    // ===== DATA =====
    async function loadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('accordion').style.display = 'none';

      try {
        const res = await fetch(`${API_URL}?action=list&password=${encodeURIComponent(password)}`);
        const json = await res.json();

        if (!json.success) {
          if (json.error === 'Senha inválida') {
            logout();
            document.getElementById('login-error').style.display = 'block';
            document.getElementById('login-error').textContent = 'Senha inválida';
            return;
          }
          throw new Error(json.error || 'Erro ao carregar');
        }

        allData = json.data || [];
        renderKPIs();
        renderAccordion();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('accordion').style.display = 'flex';
      } catch (err) {
        document.getElementById('loading').innerHTML = `Erro: ${err.message}`;
      }
    }

    // ===== KPIs =====
    function renderKPIs() {
      const total = allData.length;
      const ativo = allData.filter(d => d.Status === 'Ativo').length;
      const desacel = allData.filter(d => d.Status === 'Desacelerando').length;
      const pausado = allData.filter(d => d.Status === 'Pausado').length;
      const projetos = allData.filter(d => (d.Tipo || '').includes('Projeto')).length;
      const produtos = allData.filter(d => (d.Tipo || '').includes('Produto')).length;

      const fases = ['Ideação','Laboratório','Construção','Escalonamento','Operação','Arquivo / Hibernação'];
      let faseHtml = fases.map(f => {
        const qtd = allData.filter(d => d['Fase Atual'] === f).length;
        return `<div class="kpi"><div class="number">${qtd}</div><div class="label">${f.split(' ')[0]}</div></div>`;
      }).join('');

      document.getElementById('kpis').innerHTML = `
        <div class="kpi"><div class="number">${total}</div><div class="label">Total</div></div>
        <div class="kpi"><div class="number">${ativo}</div><div class="label">Ativos</div></div>
        <div class="kpi"><div class="number">${desacel}</div><div class="label">Desacelerando</div></div>
        <div class="kpi"><div class="number">${pausado}</div><div class="label">Pausados</div></div>
        <div class="kpi"><div class="number">${projetos}</div><div class="label">Projetos</div></div>
        <div class="kpi"><div class="number">${produtos}</div><div class="label">Produtos</div></div>
        ${faseHtml}
      `;
    }

    // ===== ACCORDION =====
    function renderAccordion() {
      const search = document.getElementById('search').value.toLowerCase();
      const status = document.getElementById('filter-status').value;
      const tipo = document.getElementById('filter-tipo').value;

      const filtered = allData.filter(item => {
        if (search && !(item.Nome || '').toLowerCase().includes(search)) return false;
        if (status && item.Status !== status) return false;
        if (tipo && item.Tipo !== tipo) return false;
        return true;
      });

      const fasesOrder = ['Ideação','Laboratório','Construção','Escalonamento','Operação','Arquivo / Hibernação','Não classificado'];
      const grouped = {};
      filtered.forEach(item => {
        const f = item['Fase Atual'] || 'Não classificado';
        if (!grouped[f]) grouped[f] = [];
        grouped[f].push(item);
      });

      let html = '';
      fasesOrder.forEach(fase => {
        if (!grouped[fase] || grouped[fase].length === 0) return;
        const items = grouped[fase];
        html += `
          <div class="acc-group open" data-fase="${fase}">
            <div class="acc-header" onclick="toggleAcc(this)">
              <h3>${fase} <span class="count">(${items.length})</span></h3>
              <span class="chevron">▼</span>
            </div>
            <div class="acc-body">
              ${items.map(item => `
                <div class="item-row">
                  <div class="nome" data-label="Nome">${item.Nome || '—'}</div>
                  <div data-label="Status"><span class="badge badge-${(item.Status||'').toLowerCase().replace(/ /g,'').replace('ç','c')}">${item.Status || '—'}</span></div>
                  <div data-label="Prioridade">${item.Prioridade || '—'}</div>
                  <div data-label="Dias">${item['Dias Parado'] ?? '—'}</div>
                  <div data-label="Próxima Ação">${item['Próxima Ação'] || '—'}</div>
                  <div class="obs" data-label="Observações">${item['Observações / Histórico'] || '—'}</div>
                  <div data-label="Email LLM">${item['Conta Email LLM'] || '—'}</div>
                  <div data-label="Ações">
                    ${item['Link da Pasta'] ? `<a class="link-btn" href="${item['Link da Pasta']}" target="_blank">Abrir</a>` : ''}
                    <button class="btn btn-sm" style="margin-top:4px;" onclick='openEdit(${JSON.stringify(item).replace(/'/g,"&#39;")})'>Editar</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      document.getElementById('accordion').innerHTML = html || '<div class="empty">Nenhum registro encontrado</div>';
    }

    function toggleAcc(el) {
      el.parentElement.classList.toggle('open');
    }

    // ===== MODALS =====
    function openEdit(item) {
      currentRow = item._row;
      document.getElementById('modal-title').textContent = item.Nome || 'Editar';
      document.getElementById('edit-status').value = item.Status || 'Ativo';
      document.getElementById('edit-prioridade').value = item.Prioridade || 'Média';
      document.getElementById('edit-proxima').value = item['Próxima Ação'] || '';
      document.getElementById('edit-obs').value = item['Observações / Histórico'] || '';
      document.getElementById('edit-agente').value = item.Agente || '';
      document.getElementById('edit-llm').value = item.LLM || '';
      document.getElementById('edit-email').value = item['Conta Email LLM'] || '';
      document.getElementById('modal-error').style.display = 'none';
      document.getElementById('modal-edit').classList.add('active');
    }

    function openAgentModal() {
      document.getElementById('agent-error').style.display = 'none';
      document.getElementById('modal-agent').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    async function saveEdit() {
      const payload = {
        action: 'update',
        password,
        row: currentRow,
        'Status': document.getElementById('edit-status').value,
        'Prioridade': document.getElementById('edit-prioridade').value,
        'Próxima Ação': document.getElementById('edit-proxima').value,
        'Observações / Histórico': document.getElementById('edit-obs').value,
        'Agente': document.getElementById('edit-agente').value,
        'LLM': document.getElementById('edit-llm').value,
        'Conta Email LLM': document.getElementById('edit-email').value
      };

      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const json = await res.json();
        if (!json.success) {
          document.getElementById('modal-error').style.display = 'block';
          document.getElementById('modal-error').textContent = json.error || 'Erro ao salvar';
          return;
        }
        closeModal('modal-edit');
        loadData();
      } catch (err) {
        document.getElementById('modal-error').style.display = 'block';
        document.getElementById('modal-error').textContent = err.message;
      }
    }

    function saveAgent() {
      // Por enquanto só feedback visual.
      // Próximo passo: criar aba "Agentes" e endpoint no Apps Script.
      const nome = document.getElementById('agent-nome').value.trim();
      if (!nome) {
        document.getElementById('agent-error').style.display = 'block';
        document.getElementById('agent-error').textContent = 'Nome do agente é obrigatório';
        return;
      }
      alert('Cadastro de agentes será conectado à planilha na próxima etapa.\n\nAgente: ' + nome);
      closeModal('modal-agent');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeModal('modal-edit');
        closeModal('modal-agent');
      }
    });
  </script>
</body>
</html>
