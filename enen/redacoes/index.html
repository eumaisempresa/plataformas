<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma de Redação Enem 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

  <!-- NAVBAR -->
  <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">🎯 Enem 2026 - Mestre da Redação</h1>
    <div id="userStatus" class="text-sm"></div>
  </nav>

  <div class="max-w-6xl mx-auto p-4">

    <!-- FORMULÁRIO DE AUTENTICAÇÃO / CADASTRO -->
    <div id="authSection" class="grid grid-cols-1 md:grid-cols-2 gap-6 my-8">
      
      <!-- CADASTRO -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-blue-600">Criar Nova Conta</h2>
        <form id="cadForm" onsubmit="handleCadastrar(event)" class="space-y-3">
          <input type="text" id="cadNome" placeholder="Nome Completo" required class="w-full p-2 border rounded">
          <input type="text" id="cadEscola" placeholder="Nome da sua Escola" required class="w-full p-2 border rounded">
          <input type="email" id="cadEmail" placeholder="E-mail" required class="w-full p-2 border rounded">
          <input type="tel" id="cadWhatsapp" placeholder="WhatsApp (ex: 27999999999)" required class="w-full p-2 border rounded">
          <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold">Cadastrar</button>
        </form>
        <div id="cadFeedback" class="mt-3 text-sm"></div>
      </div>

      <!-- LOGIN -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-bold mb-4 text-blue-600">Acessar Painel</h2>
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3">
          <input type="email" id="loginEmail" placeholder="E-mail" required class="w-full p-2 border rounded">
          <input type="password" id="loginSenha" placeholder="Senha" required class="w-full p-2 border rounded">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold">Entrar</button>
        </form>
        <div id="loginFeedback" class="mt-3 text-sm text-red-500"></div>
      </div>

    </div>

    <!-- PAINEL DO ALUNO (OCULTO ATÉ LOGAR) -->
    <div id="appSection" class="hidden space-y-8">
      
      <!-- TROCA DE SENHA -->
      <div class="bg-white p-4 rounded-lg shadow flex flex-wrap justify-between items-center gap-4">
        <div>
          <span class="font-bold text-gray-700">Alterar Minha Senha:</span>
        </div>
        <form onsubmit="handleAlterarSenha(event)" class="flex gap-2 w-full md:w-auto">
          <input type="password" id="senhaAtual" placeholder="Senha Atual" required class="p-2 border rounded text-sm">
          <input type="password" id="novaSenha" placeholder="Nova Senha" required class="p-2 border rounded text-sm">
          <button type="submit" class="bg-gray-800 text-white px-4 py-2 rounded text-sm font-bold">Atualizar</button>
        </form>
      </div>

      <!-- BANCO DE TEMAS E DICAS (GERADOS AUTOMATICAMENTE PELO GEMINI) -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">📚 Simulações & Banco de Temas Enem 2026</h2>
        <div id="listaTemas" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <p class="text-gray-500">Carregando banco de temas...</p>
        </div>
      </div>

      <!-- ENVIAR REDAÇÃO PARA CORREÇÃO DA IA -->
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">✍️ Simulado de Correção Inteligente</h2>
        <form onsubmit="handleCorrigirRedacao(event)" class="space-y-4">
          <div>
            <label class="block font-bold mb-1">Tema da Redação:</label>
            <input type="text" id="redacaoTema" placeholder="Digite o tema exato" required class="w-full p-2 border rounded">
          </div>
          <div>
            <label class="block font-bold mb-1">Texto da Redação:</label>
            <textarea id="redacaoTexto" rows="12" placeholder="Cole aqui seu texto completo..." required class="w-full p-2 border rounded"></textarea>
          </div>
          <button type="submit" id="btnCorrigir" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded font-bold text-lg">Submeter para Correção (IA)</button>
        </form>
      </div>

      <!-- RESULTADO DA CORREÇÃO DA IA -->
      <div id="resultadoCorrecao" class="hidden bg-white p-6 rounded-lg shadow space-y-4">
        <h3 class="text-2xl font-bold text-purple-700">Resultado da Correção Enem 2026</h3>
        <div class="text-3xl font-extrabold text-center bg-purple-100 p-4 rounded-lg">
          Nota Final: <span id="notaFinal" class="text-purple-800">0</span> / 1000
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-5 gap-2 text-center font-bold">
          <div class="bg-gray-100 p-2 rounded">C1: <span id="notaC1">0</span></div>
          <div class="bg-gray-100 p-2 rounded">C2: <span id="notaC2">0</span></div>
          <div class="bg-gray-100 p-2 rounded">C3: <span id="notaC3">0</span></div>
          <div class="bg-gray-100 p-2 rounded">C4: <span id="notaC4">0</span></div>
          <div class="bg-gray-100 p-2 rounded">C5: <span id="notaC5">0</span></div>
        </div>

        <div id="detalhesCorrecao" class="space-y-2 mt-4"></div>
      </div>

    </div>

  </div>

  <script>
    const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbx_nxZL6g9rbcLIjJRd8WS-Vpq_LqAmRi3aKRJx5SEp7Zf-skw7Vfu6sXpImGHaLlh2yw/exec";
    let usuarioLogado = null;

    // CADASTRAR ALUNO
    async function handleCadastrar(e) {
      e.preventDefault();
      const feedback = document.getElementById('cadFeedback');
      feedback.innerText = "Cadastrando...";
      
      const payload = {
        action: 'cadastrar',
        dados: {
          nome: document.getElementById('cadNome').value,
          escola: document.getElementById('cadEscola').value,
          email: document.getElementById('cadEmail').value,
          whatsapp: document.getElementById('cadWhatsapp').value
        }
      };

      const res = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      
      if (data.success) {
        feedback.innerHTML = `<span class="text-green-600 font-bold">Sucesso! Sua senha é: ${data.tempPassword}. Ela também foi enviada para o seu e-mail.</span>`;
      } else {
        feedback.innerHTML = `<span class="text-red-600">${data.message}</span>`;
      }
    }

    // LOGIN
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const senha = document.getElementById('loginSenha').value;

      const res = await fetch(WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', email: email, senha: senha })
      });
      const data = await res.json();

      if (data.success) {
        usuarioLogado = data.usuario;
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('userStatus').innerText = `Logado como: ${usuarioLogado.nome}`;
        carregarTemas();
      } else {
        document.getElementById('loginFeedback').innerText = data.message;
      }
    }

    // ALTERAR SENHA
    async function handleAlterarSenha(e) {
      e.preventDefault();
      const res = await fetch(WEBAPP_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'alterarSenha',
          email: usuarioLogado.email,
          senhaAntiga: document.getElementById('senhaAtual').value,
          novaSenha: document.getElementById('novaSenha').value
        })
      });
      const data = await res.json();
      alert(data.message);
    }

    // BUSCAR BANCO DE TEMAS E DICAS
    async function carregarTemas() {
      const res = await fetch(`${WEBAPP_URL}?action=getTemas`);
      const data = await res.json();
      const container = document.getElementById('listaTemas');
      container.innerHTML = '';

      if (data.success && data.temas.length > 0) {
        data.temas.forEach(item => {
          container.innerHTML += `
            <div class="border p-4 rounded shadow-sm bg-gray-50">
              <span class="text-xs bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded">${item.eixo}</span>
              <h3 class="font-bold text-lg mt-2">${item.tema}</h3>
              <p class="text-sm text-gray-600 mt-1"><b>Teses:</b> ${item.teses}</p>
              <p class="text-sm text-gray-600"><b>Repertórios:</b> ${item.repertorios}</p>
              ${item.dicas ? `<div class="mt-3 p-2 bg-yellow-50 border-l-4 border-yellow-400 text-xs"><b>💡 Dica Simulada:</b> ${item.dicas}</div>` : ''}
            </div>
          `;
        });
      } else {
        container.innerHTML = '<p class="text-gray-500">Nenhum tema cadastrado ainda.</p>';
      }
    }

    // SUBMETER REDAÇÃO PARA CORREÇÃO
    async function handleCorrigirRedacao(e) {
      e.preventDefault();
      const btn = document.getElementById('btnCorrigir');
      btn.disabled = true;
      btn.innerText = "Avaliando redação com Inteligência Artificial...";

      const payload = {
        action: 'corrigirRedacao',
        emailAluno: usuarioLogado.email,
        tema: document.getElementById('redacaoTema').value,
        texto: document.getElementById('redacaoTexto').value
      };

      const res = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
      const data = await res.json();
      btn.disabled = false;
      btn.innerText = "Submeter para Correção (IA)";

      if (data.success) {
        const av = data.avaliacao;
        document.getElementById('resultadoCorrecao').classList.remove('hidden');
        document.getElementById('notaFinal').innerText = av.nota_final;
        document.getElementById('notaC1').innerText = av.c1;
        document.getElementById('notaC2').innerText = av.c2;
        document.getElementById('notaC3').innerText = av.c3;
        document.getElementById('notaC4').innerText = av.c4;
        document.getElementById('notaC5').innerText = av.c5;

        let htmlDetalhes = '<h4 class="font-bold">Comentários por Competência:</h4>';
        for (let key in av.detalhes) {
          htmlDetalhes += `<p class="text-sm"><b>${key.toUpperCase()}:</b> ${av.detalhes[key]}</p>`;
        }

        if(av.plano_acao) {
          htmlDetalhes += '<h4 class="font-bold mt-3">Plano de Ação:</h4><ul class="list-disc ml-5 text-sm">';
          av.plano_acao.forEach(item => htmlDetalhes += `<li>${item}</li>`);
          htmlDetalhes += '</ul>';
        }

        document.getElementById('detalhesCorrecao').innerHTML = htmlDetalhes;
      } else {
        alert("Erro na correção: " + data.message);
      }
    }
  </script>
</body>
</html>
