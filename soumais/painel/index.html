<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Executivo | Sou+</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .kanban-col { min-height: calc(100vh - 180px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- OVERLAY LOGIN / RECUPERAÇÃO -->
  <div id="loginOverlay" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-6 shadow-2xl">
      
      <!-- FORM LOGIN -->
      <div id="boxLogin" class="space-y-4">
        <div class="text-center space-y-1">
          <div class="inline-flex w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 font-bold text-xl items-center justify-center mb-2">
            EU<span class="text-amber-500 text-sm font-bold relative -top-1">+</span>
          </div>
          <h2 class="text-xl font-bold text-white">Acesso ao Painel Sou+</h2>
          <p class="text-xs text-slate-400">Informe suas credenciais atreladas à sua conta.</p>
        </div>

        <form onsubmit="executarLogin(event)" class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">E-mail</label>
            <input type="email" id="loginEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 focus:outline-none">
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="text-xs text-slate-400">Senha</label>
              <button type="button" onclick="alternarTelaLogin('recuperar')" class="text-xs text-amber-400 hover:underline">Esqueceu a senha?</button>
            </div>
            <input type="password" id="loginSenha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 focus:outline-none">
          </div>
          <button type="submit" id="btnLoginSubmit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-amber-500/10">Entrar no Painel</button>
        </form>
      </div>

      <!-- FORM RECUPERAR SENHA -->
      <div id="boxRecuperar" class="hidden space-y-4">
        <div class="text-center space-y-1">
          <h2 class="text-xl font-bold text-white">Recuperar Senha</h2>
          <p class="text-xs text-slate-400">Digite seu e-mail cadastrado para receber uma nova senha.</p>
        </div>

        <form onsubmit="executarRecuperacao(event)" class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">E-mail Cadastrado</label>
            <input type="email" id="recuperarEmail" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 focus:outline-none">
          </div>
          <button type="submit" id="btnRecuperarSubmit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition-all">Enviar Nova Senha por E-mail</button>
          <button type="button" onclick="alternarTelaLogin('login')" class="w-full text-xs text-slate-400 hover:text-white py-1">Voltar ao Login</button>
        </form>
      </div>

    </div>
  </div>

  <!-- MODAL DE ALTERAÇÃO DE SENHA (DENTRO DO PAINEL) -->
  <div id="modalAlterarSenha" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-white text-base">Alterar Minha Senha</h3>
        <button onclick="fecharModalSenha()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <form onsubmit="executarTrocaSenha(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Senha Atual</label>
          <input type="password" id="senhaAtual" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nova Senha</label>
          <input type="password" id="novaSenha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:border-amber-500 focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-xl text-sm">Atualizar Senha</button>
      </form>
    </div>
  </div>

  <!-- HEADER PRINCIPAL -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-6 py-3 flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 font-bold text-base flex items-center justify-center">
        EU<span class="text-amber-500 text-xs font-bold relative -top-0.5">+</span>
      </div>
      <span id="nomeClienteHeader" class="font-bold text-sm text-white tracking-tight">Painel Executivo</span>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="abrirModalSenha()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-3 py-1.5 rounded-lg border border-slate-700 transition-all flex items-center gap-1.5">
        <i data-lucide="key" class="w-3.5 h-3.5 text-amber-400"></i> Alterar Senha
      </button>
      <button onclick="logout()" class="text-xs bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold px-3 py-1.5 rounded-lg border border-red-500/20 transition-all">Sair</button>
    </div>
  </header>

  <!-- KANBAN BOARD -->
  <main class="flex-1 p-6 overflow-x-auto">
    <div class="flex gap-4 min-w-[1400px]">
      
      <!-- COLUNAS DO KANBAN -->
      <!-- 1. Entrada -->
      <div class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-3 flex flex-col kanban-col">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="font-bold text-xs uppercase tracking-wider text-amber-400">1. Entrada / Form</span>
          <span id="count-etapa1" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="coluna-etapa1" class="space-y-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 2. Qualificação -->
      <div class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-3 flex flex-col kanban-col">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="font-bold text-xs uppercase tracking-wider text-blue-400">2. Qualificação</span>
          <span id="count-etapa2" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="coluna-etapa2" class="space-y-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 3. Diagnóstico -->
      <div class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-3 flex flex-col kanban-col">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="font-bold text-xs uppercase tracking-wider text-indigo-400">3. Diagnóstico</span>
          <span id="count-etapa3" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="coluna-etapa3" class="space-y-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 4. Proposta -->
      <div class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-3 flex flex-col kanban-col">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="font-bold text-xs uppercase tracking-wider text-purple-400">4. Proposta</span>
          <span id="count-etapa4" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="coluna-etapa4" class="space-y-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 5. Cliente Ativo -->
      <div class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-3 flex flex-col kanban-col">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="font-bold text-xs uppercase tracking-wider text-emerald-400">5. Cliente Ativo</span>
          <span id="count-etapa5" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="coluna-etapa5" class="space-y-3 flex-1 overflow-y-auto"></div>
      </div>

      <!-- 6. Arquivado -->
      <div class="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl p-3 flex flex-col kanban-col">
        <div class="flex justify-between items-center mb-3 px-1">
          <span class="font-bold text-xs uppercase tracking-wider text-slate-500">6. Arquivado</span>
          <span id="count-etapa6" class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-bold">0</span>
        </div>
        <div id="coluna-etapa6" class="space-y-3 flex-1 overflow-y-auto"></div>
      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();
    
    // URL DO WEB APP EXCLUSIVO DESTE CLIENTE
    const API_CLIENTE_URL = "https://script.google.com/macros/s/AKfycbz40mFBeBz3jBdLcd8XcwVyDSh4nXOVskCa6wEFSl7UyPjWBOqKCD94RZ_nMcwREYOG/exec";
    
    let usuarioLogado = null;
    let leadsCarregados = [];

    function alternarTelaLogin(tela) {
      document.getElementById('boxLogin').classList.toggle('hidden', tela !== 'login');
      document.getElementById('boxRecuperar').classList.toggle('hidden', tela !== 'recuperar');
    }

    async function executarLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLoginSubmit');
      btn.disabled = true;
      btn.innerText = "Autenticando...";

      const email = document.getElementById('loginEmail').value;
      const senha = document.getElementById('loginSenha').value;

      try {
        const res = await fetch(API_CLIENTE_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", email, senha })
        }).then(r => r.json());

        if (res.status === "success") {
          usuarioLogado = res.usuario;
          document.getElementById('nomeClienteHeader').innerText = `Painel — ${usuarioLogado.nome}`;
          document.getElementById('loginOverlay').classList.add('hidden');
          carregarLeads();
        } else {
          alert(res.message);
          btn.disabled = false;
          btn.innerText = "Entrar no Painel";
        }
      } catch (err) {
        alert("Erro na comunicação com o servidor.");
        btn.disabled = false;
        btn.innerText = "Entrar no Painel";
      }
    }

    async function executarRecuperacao(e) {
      e.preventDefault();
      const btn = document.getElementById('btnRecuperarSubmit');
      btn.disabled = true;
      btn.innerText = "Enviando...";

      const email = document.getElementById('recuperarEmail').value;

      const res = await fetch(API_CLIENTE_URL, {
        method: "POST",
        body: JSON.stringify({ action: "recuperarSenha", email })
      }).then(r => r.json());

      alert(res.message);
      btn.disabled = false;
      btn.innerText = "Enviar Nova Senha por E-mail";
      if (res.status === "success") alternarTelaLogin('login');
    }

    function abrirModalSenha() { document.getElementById('modalAlterarSenha').classList.remove('hidden'); }
    function fecharModalSenha() { document.getElementById('modalAlterarSenha').classList.add('hidden'); }

    async function executarTrocaSenha(e) {
      e.preventDefault();
      const senhaAtual = document.getElementById('senhaAtual').value;
      const novaSenha = document.getElementById('novaSenha').value;

      const res = await fetch(API_CLIENTE_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "alterarSenha",
          email: usuarioLogado.email,
          senhaAtual,
          novaSenha
        })
      }).then(r => r.json());

      alert(res.message);
      if (res.status === "success") {
        fecharModalSenha();
        document.getElementById('senhaAtual').value = "";
        document.getElementById('novaSenha').value = "";
      }
    }

    async function carregarLeads() {
      const res = await fetch(API_CLIENTE_URL, {
        method: "POST",
        body: JSON.stringify({ action: "carregarLeads" })
      }).then(r => r.json());

      if (res.status === "success") {
        leadsCarregados = res.leads;
        renderizarKanban();
      }
    }

    function renderizarKanban() {
      for (let i = 1; i <= 6; i++) {
        document.getElementById(`coluna-etapa${i}`).innerHTML = "";
        document.getElementById(`count-etapa${i}`).innerText = "0";
      }

      leadsCarregados.forEach(lead => {
        let colIndex = 1;
        if (lead.etapa.includes("Qualificação")) colIndex = 2;
        else if (lead.etapa.includes("Diagnóstico")) colIndex = 3;
        else if (lead.etapa.includes("Proposta")) colIndex = 4;
        else if (lead.etapa.includes("Ativo")) colIndex = 5;
        else if (lead.etapa.includes("Arquivado")) colIndex = 6;

        const card = document.createElement('div');
        card.className = "bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2 hover:border-amber-500/50 transition-all";
        card.innerHTML = `
          <div class="font-bold text-xs text-white">${lead.empresa || lead.nome}</div>
          <div class="text-[11px] text-slate-400 flex items-center gap-1"><i data-lucide="user" class="w-3 h-3"></i> ${lead.nome}</div>
          <div class="text-[11px] text-slate-400 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> ${lead.cidade || 'N/I'} - ${lead.estado || ''}</div>
          <a href="https://wa.me/55${lead.whatsapp.replace(/\D/g, '')}" target="_blank" class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-lg">
            <i data-lucide="message-circle" class="w-3 h-3"></i> WhatsApp
          </a>
        `;
        document.getElementById(`coluna-etapa${colIndex}`).appendChild(card);
      });

      for (let i = 1; i <= 6; i++) {
        const count = document.getElementById(`coluna-etapa${i}`).children.length;
        document.getElementById(`count-etapa${i}`).innerText = count;
      }
      lucide.createIcons();
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
